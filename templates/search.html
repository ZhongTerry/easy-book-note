<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全网搜书 - Smart NoteDB</title>
    <link rel="stylesheet" href="/purecss/pure2.1.css">
    <script src="/purecss/pure2.1.js"></script>
    <script src="/static/js/csrf.js"></script>
    <link rel="icon" href="/static/icons/favicon.ico" type="image/x-icon">
    <style>
        /* 继承 index.html 的配色方案 */
        body {
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* 顶部用户栏（与 index.html 一致）*/
        #userBar {
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        /* 主容器（与 index.html 一致）*/
        .container {
            max-width: 900px;
            margin: 80px auto 40px;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
            border: 1px solid #f1f5f9;
        }
        
        h1 {
            margin-top: 0;
            color: #1f2937;
            text-align: center;
            font-size: 26px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        /* 搜索栏 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
        }
        
        /* 功能选项卡 */
        .feature-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #6b7280;
        }
        
        .feature-item input[type="checkbox"] {
            cursor: pointer;
        }
        
        /* 搜索历史 */
        .history-section {
            margin-bottom: 20px;
        }
        
        .history-title {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .history-tag {
            padding: 4px 12px;
            background: #f3f4f6;
            border-radius: 6px;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #e5e7eb;
        }
        
        .history-tag:hover {
            background: #e5e7eb;
            border-color: #4f46e5;
        }
        
        .clear-history {
            font-size: 12px;
            color: #ef4444;
            cursor: pointer;
            text-decoration: underline;
        }
        
        /* 结果区域 */
        .results-area {
            min-height: 300px;
        }
        
        .result-item {
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        
        .result-item:hover {
            border-color: #4f46e5;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.1);
            transform: translateX(2px);
        }
        
        .res-left {
            flex: 1;
        }
        
        .res-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 6px;
        }
        
        .res-author {
            color: #6b7280;
            font-size: 13px;
            margin-left: 8px;
        }
        
        .res-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 12px;
            color: #9ca3af;
            flex-wrap: wrap;
        }
        
        .source-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .tag-baidu { background: #dbeafe; color: #1e40af; }
        .tag-bing { background: #fef3c7; color: #92400e; }
        .tag-360 { background: #d1fae5; color: #065f46; }
        .tag-direct { background: #e0e7ff; color: #4338ca; }
        .tag-searx { background: #e5eefb; color: #24558f; }
        .status-ready { background: #dcf3e6; color: #1e6b45; }
        .status-unverified { background: #edf1f3; color: #596a74; }
        .status-blocked, .status-unavailable, .status-unsafe { background: #f8e7e7; color: #9b3b3b; }
        
        .res-url {
            font-family: monospace;
            color: #4f46e5;
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 350px;
            cursor: pointer;
            text-decoration: underline;
        }
        
        .res-url:hover {
            color: #6366f1;
        }
        
        .res-action {
            color: #4f46e5;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            margin-left: auto;
            cursor: pointer;
        }
        
        .res-action:hover {
            color: #6366f1;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
        
        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.4;
        }
        
        /* 统计信息 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 15px;
            font-size: 13px;
            color: #6b7280;
        }
        
        /* 排序选项 */
        .sort-options {
            display: flex;
            gap: 10px;
        }
        
        .sort-btn {
            padding: 4px 10px;
            font-size: 12px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            color: #6b7280;
        }
        
        .sort-btn.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }
        
        /* 移动端适配 */
        @media (max-width: 640px) {
            .container {
                padding: 20px;
                margin-top: 60px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .feature-tabs {
                display: none; /* 移动端隐藏高级选项 */
            }
            
            .res-url {
                max-width: 150px;
            }
            
            .stats-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        /* Search refinement: a compact research surface aligned with the shelf and reader. */
        :root { --search-bg:#eef2f3; --search-panel:#ffffff; --search-text:#26343d; --search-muted:#6b7b86; --search-border:#dce4e8; --search-accent:#0f766e; }
        body { padding:0; background:var(--search-bg); color:var(--search-text); }
        #userBar { min-height:58px; padding:8px max(20px,calc((100% - 1120px) / 2)); background:rgba(255,255,255,.94); border-bottom-color:var(--search-border); }
        #userBar a { color:var(--search-text) !important; font-size:14px; }
        #userName { color:var(--search-muted) !important; }
        .container { width:min(900px,calc(100% - 40px)); max-width:none; margin:94px auto 36px; padding:0; background:transparent; border:0; border-radius:0; box-shadow:none; }
        h1 { color:var(--search-text); text-align:left; font-size:25px; line-height:1.3; letter-spacing:0; margin-bottom:6px; }
        .subtitle { text-align:left; margin:0 0 24px; color:var(--search-muted); }
        .search-box { gap:8px; margin-bottom:16px; }
        .search-box .p-input { min-height:42px; border-color:var(--search-border); border-radius:6px; background:var(--search-panel); color:var(--search-text); }
        .search-box .p-input:focus { border-color:var(--search-accent); box-shadow:0 0 0 3px rgba(15,118,110,.12); }
        .search-box .p-btn { min-width:92px; border-radius:6px; background:var(--search-accent); border-color:var(--search-accent); font-weight:650; }
        .feature-tabs { gap:18px; padding:12px 0 16px; margin-bottom:18px; border-bottom-color:var(--search-border); }
        .feature-item { color:var(--search-muted); }
        .feature-item input { accent-color:var(--search-accent); }
        .history-title, .stats-bar { color:var(--search-muted); }
        .history-tag, .sort-btn { padding:5px 10px; border-radius:5px; background:var(--search-panel); border-color:var(--search-border); color:var(--search-muted); }
        .history-tag:hover, .sort-btn:hover { color:var(--search-accent); border-color:var(--search-accent); background:rgba(15,118,110,.06); }
        .sort-btn.active { background:rgba(15,118,110,.1); border-color:var(--search-accent); color:var(--search-accent); }
        .results-area { min-height:260px; }
        .result-item { display:flex; align-items:center; gap:20px; padding:16px 0; margin:0; border:0; border-bottom:1px solid var(--search-border); border-radius:0; background:transparent; }
        .result-item:hover { transform:none; border-color:var(--search-border); box-shadow:none; }
        .res-left { min-width:0; }
        .res-title { color:var(--search-text); font-size:16px; line-height:1.45; margin-bottom:7px; }
        .res-author { color:var(--search-muted); font-weight:400; }
        .res-meta { gap:8px; color:var(--search-muted); }
        .source-tag { padding:3px 7px; border-radius:4px; }
        .tag-baidu { background:#e7f0f8; color:#2e5877; }.tag-bing { background:#f4eee1; color:#765a22; }.tag-360 { background:#e4f2ef; color:#17645c; }.tag-direct { background:#e9edef; color:#405762; }.tag-searx { background:#e5eefb; color:#24558f; }.status-ready { background:#dcf3e6; color:#1e6b45; }.status-unverified { background:#edf1f3; color:#596a74; }.status-blocked, .status-unavailable, .status-unsafe { background:#f8e7e7; color:#9b3b3b; }
        .res-url { max-width:min(380px,45vw); color:var(--search-muted); font-family:inherit; text-decoration:none; }
        .res-url:hover { color:var(--search-accent); }
        .res-action { display:inline-flex; align-items:center; justify-content:center; min-width:70px; height:34px; margin-left:auto; padding:0 12px; border:1px solid var(--search-border); border-radius:5px; color:var(--search-accent); font-size:13px; }
        .res-action:hover { color:var(--search-accent); border-color:var(--search-accent); background:rgba(15,118,110,.06); }
        .empty-state { padding:72px 20px; color:var(--search-muted); }
        .empty-state svg { color:var(--search-accent); opacity:.36; }
        .search-state { min-height:240px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--search-muted); }
        .search-state .state-mark { width:42px; height:42px; display:grid; place-items:center; margin-bottom:14px; border:1px solid var(--search-border); border-radius:50%; color:var(--search-accent); font-size:19px; }
        .search-state.error .state-mark { color:#ad3f3f; border-color:#e9caca; }
        .search-state h2 { margin:0 0 7px; color:var(--search-text); font-size:16px; font-weight:650; }
        .search-state p { margin:0; font-size:13px; line-height:1.6; overflow-wrap:anywhere; }
        .search-state .p-btn { min-height:34px; margin-top:18px; border:1px solid var(--search-border); border-radius:5px; background:var(--search-panel); color:var(--search-accent); font-weight:600; }
        .search-state .p-btn:hover { border-color:var(--search-accent); background:rgba(15,118,110,.06); }
        .search-spinner { width:28px; height:28px; margin-bottom:16px; border:3px solid var(--search-border); border-top-color:var(--search-accent); border-radius:50%; animation:spin .75s linear infinite; }
        @media (max-width:640px) { body { padding:0; }.container { width:calc(100% - 28px); margin:78px auto 28px; }.container h1 { font-size:22px; }.search-box { flex-direction:row; }.search-box .p-btn { min-width:70px; }.feature-tabs { display:flex; gap:12px; padding-top:4px; }.feature-item:nth-child(3) { display:none; }.result-item { display:block; padding:14px 0; }.res-meta { align-items:center; }.res-url { max-width:calc(100vw - 178px); }.res-action { position:absolute; right:0; bottom:0; }.result-item { position:relative; padding-right:84px; }.res-action { margin:0; }.stats-bar { flex-direction:row; align-items:center; }.sort-options { gap:6px; } }
    </style>
</head>
<body>
    <!-- 顶部用户栏 -->
    <div id="userBar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <a href="/" style="text-decoration: none; color: #1f2937; font-weight: 600;">← 返回书架</a>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <span id="userName" style="font-size: 13px; color: #6b7280;">Loading...</span>
        </div>
    </div>

    <div class="container">
        <h1>🔍 全网搜书</h1>
        <p class="subtitle">聚合多个搜索引擎，一键找书</p>
        
        <!-- 搜索栏 -->
        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                class="p-input" 
                placeholder="输入书名或作者，如：凡人修仙传" 
                autofocus
                onkeydown="if(event.key==='Enter') doSearch()"
            >
            <button class="p-btn p-btn-primary" onclick="doSearch()">搜索</button>
        </div>
        
        <!-- 功能选项 -->
        <div class="feature-tabs">
            <div class="feature-item">
                <input type="checkbox" id="autoSave" checked>
                <label for="autoSave">自动保存到书架</label>
            </div>
            <div class="feature-item">
                <input type="checkbox" id="showUrl" checked>
                <label for="showUrl">显示源链接</label>
            </div>
            <div class="feature-item">
                <span style="color: #4b5563;">搜索服务: <strong id="sourceCount">SearXNG</strong></span>
            </div>
        </div>
        
        <!-- 搜索历史 -->
        <div class="history-section" id="historySection">
            <div class="history-title">
                <span>最近搜索</span>
                <span class="clear-history" onclick="clearHistory()">清空</span>
            </div>
            <div class="history-tags" id="historyTags">
                <!-- 动态生成 -->
            </div>
        </div>
        
        <!-- 结果统计栏 -->
        <div class="stats-bar" id="statsBar" style="display: none;">
            <span>找到 <strong id="resultCount">0</strong> 个结果</span>
            <div class="sort-options">
                <span class="sort-btn active" onclick="sortResults('default')">默认排序</span>
                <span class="sort-btn" onclick="sortResults('source')">按来源</span>
            </div>
        </div>
        
        <!-- 结果区域 -->
        <div class="results-area">
            <div id="resultsContainer" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <p style="font-size:14px; margin:0; color:#6b7280;">输入书名开始搜索</p>
                <p style="font-size:12px; margin-top:8px; color:#9ca3af;">支持书名、作者名搜索</p>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.origin;
        let searchHistory = [];
        try {
            const storedHistory = JSON.parse(localStorage.getItem('search_history') || '[]');
            if (Array.isArray(storedHistory)) searchHistory = storedHistory.filter(item => typeof item === 'string');
        } catch (error) { console.warn('Search history unavailable:', error); }
        let currentResults = [];

        // 搜索生命周期控制：每次搜索都拥有独立会话，旧会话的响应不得再改页面。
        const SEARCH_POLL_INTERVAL_MS = 1000;
        const SEARCH_POLL_TIMEOUT_MS = 60000;
        const SEARCH_REQUEST_TIMEOUT_MS = 10000;
        const SEARCH_MAX_CONSECUTIVE_POLL_ERRORS = 3;

        let searchSequence = 0;
        let activeSearch = null;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;")
                .replace(/`/g, "&#96;");
        }

        function beginSearchSession() {
            const previous = activeSearch;
            const session = { id: ++searchSequence, controller: new AbortController() };
            activeSearch = session;
            if (previous) {
                // 先登记新会话再取消旧会话，确保旧搜索的收尾逻辑看不到“当前会话”。
                previous.controller.abort();
            }
            return session;
        }

        function isCurrentSearch(session) {
            return Boolean(session) && activeSearch === session && session.id === searchSequence;
        }

        function isAbortError(error) {
            return Boolean(error) && error.name === 'AbortError';
        }

        function delayWithSignal(ms, signal) {
            return new Promise(resolve => {
                if (!signal || signal.aborted) {
                    resolve();
                    return;
                }
                const finish = () => {
                    clearTimeout(timer);
                    signal.removeEventListener('abort', finish);
                    resolve();
                };
                const timer = setTimeout(finish, ms);
                signal.addEventListener('abort', finish, { once: true });
            });
        }

        // 每次请求都有独立的超时；同时响应搜索会话的取消信号。
        async function fetchJsonWithTimeout(url, options, timeoutMs, externalSignal) {
            const controller = new AbortController();
            let timedOut = false;
            const timer = setTimeout(() => {
                timedOut = true;
                controller.abort();
            }, timeoutMs);
            const abortFromSearch = () => controller.abort();
            if (externalSignal) {
                if (externalSignal.aborted) controller.abort();
                else externalSignal.addEventListener('abort', abortFromSearch, { once: true });
            }

            try {
                const response = await fetch(url, { ...(options || {}), signal: controller.signal });
                let payload = null;
                let parseFailed = false;
                try {
                    payload = await response.json();
                } catch (e) {
                    parseFailed = true;
                }

                if (!response.ok) {
                    const serverMessage = payload && typeof payload === 'object'
                        ? apiErrorMessage(payload, '')
                        : '';
                    throw new Error(serverMessage
                        ? `请求失败（HTTP ${response.status}）：${serverMessage}`
                        : `请求失败（HTTP ${response.status}${response.statusText ? ' ' + response.statusText : ''}）`);
                }
                if (parseFailed) {
                    throw new Error('服务返回的不是有效 JSON，登录状态可能已失效');
                }
                return payload;
            } catch (error) {
                if (timedOut) {
                    const timeoutError = new Error(`请求超时（${Math.round(timeoutMs / 1000)} 秒）`);
                    timeoutError.name = 'TimeoutError';
                    throw timeoutError;
                }
                if (isAbortError(error)) throw error;
                if (error && error.name === 'TypeError') {
                    throw new Error(`无法连接搜索服务：${error.message || '网络错误'}`);
                }
                throw error;
            } finally {
                clearTimeout(timer);
                if (externalSignal) externalSignal.removeEventListener('abort', abortFromSearch);
            }
        }

        function extractResultList(payload) {
            if (Array.isArray(payload)) return payload;
            if (payload && typeof payload === 'object') {
                if (Array.isArray(payload.data)) return payload.data;
                if (Array.isArray(payload.result)) return payload.result;
            }
            return null;
        }

        function apiErrorMessage(payload, fallback) {
            if (payload && typeof payload === 'object') {
                for (const key of ['message', 'error', 'msg']) {
                    const value = payload[key];
                    if (typeof value === 'string' && value.trim()) return value.trim();
                }
            }
            return fallback;
        }

        function formatSearchError(error) {
            let message = '';
            if (error && typeof error.message === 'string') message = error.message;
            else if (error !== undefined && error !== null) message = String(error);
            message = message.trim() || '未知错误';
            return message.length > 400 ? `${message.slice(0, 400)}…` : message;
        }
        
        // 初始化
        window.onload = function() {
            renderHistory();
            loadUserInfo();
        };
        
        // 加载用户信息
        async function loadUserInfo() {
            try {
                const res = await fetch('/api/me');
                const user = await res.json();
                if (user.username) {
                    document.getElementById('userName').innerText = user.username;
                }
            } catch(e) {}
        }
        
        // 渲染搜索历史
        function renderHistory() {
            const container = document.getElementById('historyTags');
            if (searchHistory.length === 0) {
                document.getElementById('historySection').style.display = 'none';
                return;
            }
            
            document.getElementById('historySection').style.display = 'block';
            container.innerHTML = searchHistory.slice(0, 8).map(keyword => {
                const escapedKeyword = keyword
                    .replace(/\\/g, '\\\\')
                    .replace(/'/g, "\\'")
                    .replace(/"/g, '&quot;');
                return `<span class="history-tag" onclick="searchFromHistory('${escapedKeyword}')">${escapeHtml(keyword)}</span>`;
            }).join('');
        }
        
        // 从历史搜索
        function searchFromHistory(keyword) {
            document.getElementById('searchInput').value = keyword;
            doSearch();
        }
        
        // 清空历史
        function clearHistory() {
            if (confirm('确定清空搜索历史吗？')) {
                searchHistory = [];
                try { localStorage.setItem('search_history', '[]'); }
                catch (error) { console.warn('Cannot persist search history:', error); }
                renderHistory();
            }
        }
        
        // 保存搜索历史
        function saveHistory(keyword) {
            // 去重并前置
            searchHistory = [keyword, ...searchHistory.filter(k => k !== keyword)].slice(0, 20);
            try { localStorage.setItem('search_history', JSON.stringify(searchHistory)); }
            catch (error) { console.warn('Cannot persist search history:', error); }
            renderHistory();
        }

        function renderSearchState(kind, detail = '') {
            const container = document.getElementById('resultsContainer');
            const statsBar = document.getElementById('statsBar');
            if (statsBar) statsBar.style.display = 'none';
            const states = {
                loading: { mark: '', title: '正在搜索', message: '正在聚合多个书源，请稍候。' },
                empty: { mark: '⌕', title: '没有找到相关结果', message: '试试简化关键词，或改用作者名搜索。' },
                timeout: { mark: '!', title: '搜索耗时较长', message: '当前书源响应较慢，可以重新搜索。' },
                error: { mark: '!', title: '搜索暂时不可用', message: '请检查网络后重试。' },
                expired: { mark: '!', title: '搜索任务已失效', message: '请重新提交一次搜索。' }
            };
            const state = states[kind] || states.error;
            // 错误详情可能来自服务端或网络层，先规范化，再转义后写入 HTML。
            const message = detail ? formatSearchError(detail) : state.message;
            const retry = kind !== 'loading' && kind !== 'empty';
            container.innerHTML = `<div class="search-state ${kind === 'error' ? 'error' : ''}">
                ${kind === 'loading' ? '<div class="search-spinner"></div>' : `<div class="state-mark">${escapeHtml(state.mark)}</div>`}
                <h2>${escapeHtml(state.title)}</h2><p>${escapeHtml(message)}</p>
                ${retry ? '<button type="button" class="p-btn" onclick="doSearch()">重新搜索</button>' : ''}
            </div>`;
        }
        
        // 执行搜索
        async function doSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                alert('请输入书名');
                return;
            }

            const session = beginSearchSession();

            // 保存历史
            saveHistory(keyword);
            
            const statsBar = document.getElementById('statsBar');
            
            renderSearchState('loading');
            statsBar.style.display = 'none';
            PureUI.loading.show('🔍 聚合搜索中...');
            
            try {
                const json = await fetchJsonWithTimeout(
                    `${API_URL}/api/search_novel`,
                    {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({keyword: keyword})
                    },
                    SEARCH_REQUEST_TIMEOUT_MS,
                    session.controller.signal
                );

                if (!isCurrentSearch(session)) return;

                if (Array.isArray(json)) {
                    handleSearchResults(json);
                    return;
                }

                if (json && json.status === 'pending') {
                    if (!json.task_id) throw new Error('搜索任务创建失败：缺少任务编号');
                    const outcome = await pollSearchTask(json.task_id, session);
                    if (!isCurrentSearch(session) || outcome.kind === 'cancelled') return;
                    handleSearchOutcome(outcome);
                    return;
                }

                if (json && typeof json === 'object' && (json.status === 'error' || json.status === 'failed')) {
                    throw new Error(apiErrorMessage(json, '搜索服务返回失败状态'));
                }

                if (json && typeof json === 'object'
                    && (json.status === 'completed' || json.status === 'success'
                        || json.data !== undefined || json.result !== undefined)) {
                    const results = extractResultList(json);
                    if (results === null) throw new Error('搜索服务返回的结果数据格式异常');
                    handleSearchResults(results);
                    return;
                }

                throw new Error('搜索服务返回了无法识别的响应');
            } catch(e) {
                // 被新搜索取代的旧请求不渲染任何错误，也不触碰 loading。
                if (!isCurrentSearch(session) || isAbortError(e)) return;
                console.error('Search request failed:', e);
                renderSearchState('error', formatSearchError(e));
            } finally {
                if (isCurrentSearch(session)) {
                    PureUI.loading.hide();
                    activeSearch = null;
                }
            }
        }

        function handleSearchOutcome(outcome) {
            if (!outcome) {
                renderSearchState('error', '搜索任务返回了空状态');
                return;
            }
            switch (outcome.kind) {
                case 'completed':
                    handleSearchResults(outcome.data);
                    break;
                case 'timeout':
                    renderSearchState('timeout', outcome.message);
                    break;
                case 'expired':
                    renderSearchState('expired', outcome.message);
                    break;
                case 'error':
                default:
                    renderSearchState('error', outcome.message || '搜索任务执行失败');
                    break;
            }
        }
        
        // 渲染结果
        function renderResults(results) {
            const container = document.getElementById('resultsContainer');
            const showUrl = document.getElementById('showUrl').checked;
            
            container.innerHTML = results.map(item => {
                let tagClass = 'tag-360';
                if (item.source.includes('SearXNG')) tagClass = 'tag-searx';
                else if (item.source.includes('Baidu')) tagClass = 'tag-baidu';
                else if (item.source.includes('Bing')) tagClass = 'tag-bing';
                else if (item.source.includes('书香') || item.source.includes('笔趣') || item.source.includes('Direct')) tagClass = 'tag-direct';
                
                const safeTitle = escapeHtml(item.title || '');
                const safeDesc = escapeHtml(item.description || '');
                const safeUrl = escapeHtml(item.url || '');
                const safeSource = escapeHtml(item.source || 'Unknown');
                
                // 使用现有的escapeHtml函数并进一步处理引号
                const jsSafeKey = (item.suggested_key || '')
                    .replace(/\\/g, '\\\\')
                    .replace(/'/g, "\\'")
                    .replace(/"/g, '&quot;');
                const jsSafeUrl = (item.url || '')
                    .replace(/\\/g, '\\\\')
                    .replace(/'/g, "\\'")
                    .replace(/"/g, '&quot;');
                const jsSafeTitle = (item.title || '')
                    .replace(/\\/g, '\\\\')
                    .replace(/'/g, "\\'")
                    .replace(/"/g, '&quot;');
                
                // 第一行：书名和作者
                let line1 = `<div class="res-title">${safeTitle}`;
                if (item.description) {
                    line1 += ` <span class="res-author">${safeDesc}</span>`;
                }
                line1 += `</div>`;
                
                // 第二行：源链接、来源、阅读按钮
                let line2 = `<div class="res-meta">`;
                if (showUrl) {
                    line2 += `<span class="res-url" onclick="event.stopPropagation(); window.open('${jsSafeUrl}', '_blank');" title="点击在新标签页打开">${safeUrl}</span>`;
                }
                line2 += `<span class="source-tag ${tagClass}">${safeSource}</span>`;
                if (Number.isFinite(Number(item.match_score))) {
                    line2 += `<span>匹配 ${Math.round(Number(item.match_score))}%</span>`;
                }
                const statusLabels = {
                    ready_catalog: '目录可读', ready_chapter: '正文可读',
                    blocked: '访问受限', unavailable: '暂不可读',
                    unsafe: '链接受限', unverified: '尚未验证'
                };
                const status = item.status || 'unverified';
                const statusClass = status.startsWith('ready_') ? 'status-ready' : `status-${status}`;
                line2 += `<span class="source-tag ${statusClass}" title="${escapeHtml(item.status_detail || '')}">${statusLabels[status] || '暂不可读'}</span>`;
                line2 += `<span class="res-action" onclick="selectResult('${jsSafeKey}', '${jsSafeUrl}', '${jsSafeTitle}')">阅读 →</span>`;
                line2 += `</div>`;
                
                return `
                <div class="result-item">
                    ${line1}
                    ${line2}
                </div>`;
            }).join('');
        }
        
        // 排序结果
        function sortResults(type) {
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (type === 'source') {
                currentResults.sort((a, b) => a.source.localeCompare(b.source));
            } else {
                // 默认排序（保持原始顺序）
                currentResults.sort((a, b) => 0);
            }
            
            renderResults(currentResults);
        }
        
        // 选择结果 - 直接保存并打开（依赖自动判断toc/content逻辑）
        async function selectResult(key, url, title) {
            const autoSave = document.getElementById('autoSave').checked;
            PureUI.loading.show(autoSave ? '💾 保存中...' : '📖 正在打开...');
            
            try {
                if (autoSave) {
                    const saveRes = await fetch(`${API_URL}/insert`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ key: key, value: url, manual: true })
                    });
                    if (!saveRes.ok) throw new Error('保存失败');
                    PureUI.toast('✅ 已保存到书架');
                }
                
                setTimeout(() => {
                    window.location.href = autoSave
                        ? `/read?url=${encodeURIComponent(url)}&key=${encodeURIComponent(key)}`
                        : `/read?url=${encodeURIComponent(url)}`;
                }, 300);
                
            } catch(e) {
                console.error('保存搜索结果失败:', e);
                PureUI.loading.hide();
                if (autoSave) {
                    PureUI.toast('保存失败，已直接打开', 'info');
                }
                setTimeout(() => {
                    if (autoSave) {
                        window.location.href = `/read?url=${encodeURIComponent(url)}&key=${encodeURIComponent(key)}`;
                    } else {
                        window.location.href = `/read?url=${encodeURIComponent(url)}`;
                    }
                }, 300);
            }
        }

        // 轮询直到任务进入终态；调用方必须 await 它，loading 由调用方的 finally 统一收尾。
        async function pollSearchTask(taskId, session) {
            const deadline = Date.now() + SEARCH_POLL_TIMEOUT_MS;
            const statusUrl = `${API_URL}/api/task_status/${encodeURIComponent(taskId)}`;
            let consecutiveErrors = 0;

            while (true) {
                if (!isCurrentSearch(session)) return { kind: 'cancelled' };

                const remaining = deadline - Date.now();
                if (remaining <= 0) {
                    return {
                        kind: 'timeout',
                        message: `等待超过 ${Math.round(SEARCH_POLL_TIMEOUT_MS / 1000)} 秒，搜索任务可能仍在后台运行，请重新搜索。`
                    };
                }

                try {
                    const requestTimeout = Math.max(1000, Math.min(SEARCH_REQUEST_TIMEOUT_MS, remaining));
                    const task = await fetchJsonWithTimeout(
                        statusUrl,
                        { cache: 'no-store' },
                        requestTimeout,
                        session.controller.signal
                    );

                    if (!isCurrentSearch(session)) return { kind: 'cancelled' };

                    if (!task || typeof task !== 'object' || typeof task.status !== 'string') {
                        throw new Error('任务状态响应格式异常');
                    }

                    consecutiveErrors = 0;

                    if (task.status === 'completed') {
                        let results = extractResultList(task.result);
                        if (results === null) results = extractResultList(task);
                        if (results === null) {
                            return { kind: 'error', message: '搜索已完成，但未返回有效的书源结果' };
                        }
                        return { kind: 'completed', data: results };
                    }

                    if (task.status === 'failed' || task.status === 'error') {
                        // 后台失败时 message 通常只是 "Task failed"，error 才是真正原因。
                        const detail = typeof task.error === 'string' && task.error.trim()
                            ? task.error.trim()
                            : apiErrorMessage(task, '搜索任务执行失败');
                        return { kind: 'error', message: detail };
                    }

                    if (task.status === 'not_found') {
                        return { kind: 'expired' };
                    }

                    // 非终态：更新进度与中间结果。
                    if (typeof task.message === 'string' && task.message) {
                        PureUI.loading.show(task.message);
                    }
                    if (Array.isArray(task.result) && task.result.length > 0) {
                        try {
                            handleSearchResults(task.result);
                        } catch (renderError) {
                            console.error('Intermediate search render failed:', renderError);
                        }
                    }
                } catch(e) {
                    if (!isCurrentSearch(session) || isAbortError(e)) return { kind: 'cancelled' };
                    console.error('Poll error (will retry):', e);
                    consecutiveErrors += 1;
                    if (consecutiveErrors >= SEARCH_MAX_CONSECUTIVE_POLL_ERRORS) {
                        return { kind: 'error', message: formatSearchError(e) };
                    }
                }

                const waitMs = Math.min(SEARCH_POLL_INTERVAL_MS, Math.max(0, deadline - Date.now()));
                await delayWithSignal(waitMs, session.controller.signal);
            }
        }

        function handleSearchResults(data) {
             console.log("Handling Search Results:", data);
             const results = Array.isArray(data) ? data : [];
             
             const statsBar = document.getElementById('statsBar');
             
             if (results.length > 0) {
                 currentResults = results;
                 renderResults(currentResults);
                 statsBar.style.display = 'flex';
                 document.getElementById('resultCount').innerText = currentResults.length;
             } else {
                 currentResults = [];
                 statsBar.style.display = 'none'; // Hide stats if no results
                 renderSearchState('empty');
             }
        }
    </script>
    
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</body>
